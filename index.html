<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bundu & Princess Wedding Souvenir</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="script">Bundu</span> <span class="amp">&</span> <span class="script">Princess</span></h1>
            <h2 class="subtitle">Kallon     M Sovula</h2>
            <div class="date">05 | 09 | 2026</div>
        </header>
        <main>
            <div class="envelope-section">
                <div class="bride-groom left"></div>
                <div class="envelope" id="envelope">
                    <div class="seal" id="seal">B&amp;P</div>
                </div>
                <div class="bride-groom right"></div>
            </div>
            <div class="open-text">click the seal to open</div>
            <div class="envelop-label">the Envelop</div>
            <div class="countdown">
                <div class="label">SAVE THE DATE</div>
                <div id="timer">
                    <span id="months">0</span> :
                    <span id="weeks">0</span> :
                    <span id="days">0</span> :
                    <span id="hours">0</span> :
                    <span id="minutes">0</span> :
                    <span id="seconds">0</span>
                </div>
                <div class="timer-labels">
                    <span>MONTHS</span>
                    <span>WEEKS</span>
                    <span>DAYS</span>
                    <span>HOURS</span>
                    <span>MINUTES</span>
                    <span>SECONDS</span>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
