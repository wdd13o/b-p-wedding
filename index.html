<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envelope Animation</title>
    <link rel="stylesheet" href="envelop-animation.css">
</head>
<body>
    <div class="animation-page">
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="flap"></div>
                <div class="seal">B&amp;P</div>
                <div class="letter">
                    <img class="ring-graphic top-right" src="ring.webp" alt="Wedding rings">
                    <img class="ring-graphic bottom-right" src="ring.webp" alt="Wedding rings">
                    <div class="invitation-card">
                        <div class="card-header">
                            <span class="card-subtitle">Wedding Schedule</span>
                            <h1>Bundu & Princess</h1>
                        </div>
                        <ul class="timeline">
                            <li class="timeline-item" data-icon="⛪">
                                <div class="timeline-time">1:30 PM</div>
                                <div class="timeline-body">
                                    <div class="timeline-title">Wedding Ceremony</div>
                                    <div class="timeline-meta">Regitry & Bishopric</div>
                                </div>
                            </li>
                            <li class="timeline-item" data-icon="📸">
                                <div class="timeline-time">3:00 PM</div>
                                <div class="timeline-body">
                                    <div class="timeline-title">Photo Session</div>
                                    <div class="timeline-meta">Empire Photo Graphy</div>
                                </div>
                            </li>
                            <li class="timeline-item" data-icon="🍽️">
                                <div class="timeline-time">4:30 PM</div>
                                <div class="timeline-body">
                                    <div class="timeline-title">Dinner Reception</div>
                                    <div class="timeline-meta">The Church of Jesusu Christ of Latter-Day Saints</div>
                                    <div class="timeline-meta">Wan Pole, Allentown, Freetown</div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <a class="open-souvenir-btn" href="souvenir.html">Open souvenir</a>
        </div>
    </div>

    <script src="envelop-animation.js"></script>
</body>
</html>
